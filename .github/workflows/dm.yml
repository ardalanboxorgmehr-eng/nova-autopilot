name: comment-to-DM
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Override config for this run: dry_run or live"
        type: choice
        options: ["", "dry_run", "live"]
        default: ""
concurrency:
  group: dm
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reply to comments
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DM_MODE: ${{ inputs.mode }}
        run: python scripts/dm_reply.py
      - name: Record who was sent a DM
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/dm_sent.json)" ]; then
            echo "no new DMs"
            exit 0
          fi
          git config user.name "nova-autopilot"
          git config user.email "actions@github.com"
          # Keep this run's records aside. If another run pushed while we were
          # working, rebasing conflicts on state/dm_sent.json, the whole step
          # fails and this run's records are thrown away, so everyone it
          # messaged gets messaged again on a later run. Take the branch as it
          # stands and merge our records into it instead. Ported from
          # dana-autopilot, where this happened for real on 9 Nov 2026.
          mkdir -p /tmp/ours
          cp state/dm_sent.json /tmp/ours/ 2>/dev/null || true
          for try in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            python scripts/merge_state.py /tmp/ours
            if [ -z "$(git status --porcelain state/)" ]; then
              echo "nothing new to record"
              exit 0
            fi
            git add state/dm_sent.json
            git commit -m "dm: record sent messages"
            if git push; then
              exit 0
            fi
            echo "push lost a race, merging again (attempt $try)"
            sleep $((try * 5))
          done
          echo "could not record this run's messages after 5 tries"
          exit 1
